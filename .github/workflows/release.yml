name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Only the Apple Silicon .dmg is tested and published; Windows and Linux builds are not yet.
  app:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/desktop/release/*-arm64.dmg

  # The CLI bundles the core, which stays private: only `tacet` goes to npm.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter tacet publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
