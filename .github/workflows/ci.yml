name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: lint · types · architecture · knip · tests · eval without AI · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm arquitetura
      - run: pnpm knip
      - run: pnpm test:cobertura
      # Central gate: every minutes item grounded, every injected hallucination rejected.
      - run: pnpm eval:sem-ia
      - run: pnpm build

  plataformas:
    name: tests + real whisper.cpp (${{ matrix.os }})
    needs: qualidade
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      TACET_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: whisper.cpp (Homebrew)
        if: runner.os == 'macOS'
        run: brew install whisper-cpp
      - name: whisper.cpp (official release build)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-whisper.ts
          bin="$PWD/apps/desktop/resources/bin/whisper-cli"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          echo "TACET_WHISPER_BIN=$bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-base-v1
      # Real transcription on every OS; the LLM output is replayed (runners have no GPU for a 7B model).
      - name: eval
        shell: bash
        run: |
          node --conditions=development evals/rodar.ts --so-whisper --max-wer 0.15 --relatorio eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  pacote:
    name: package (${{ matrix.os }})
    needs: qualidade
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
