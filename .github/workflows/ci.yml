name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run build
      - run: pnpm -r run test

  eval:
    name: eval (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      TACET_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build

      - name: whisper.cpp (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install whisper-cpp
      - name: whisper.cpp (prebuilt release)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-whisper.mjs
          bin="$PWD/apps/desktop/resources/bin/whisper-cli"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          echo "TACET_WHISPER_BIN=$bin" >> "$GITHUB_ENV"

      - name: cache whisper model
        uses: actions/cache@v4
        with:
          path: .models
          key: whisper-base-v1

      # Transcription runs for real on every OS. The LLM step replays the outputs recorded with
      # qwen2.5:7b (eval/dataset/*/replay.llm.json) and checks them against the transcript, plus
      # the fabricated items the grounding guard must reject.
      - name: eval
        run: node apps/cli/dist/index.js eval --dataset eval/dataset --mode replay --max-wer 0.15 --report eval-${{ runner.os }}.json
      - run: cat eval-${{ runner.os }}.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ runner.os }}
          path: eval-${{ runner.os }}.*

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tacet/core build
      - run: pnpm --filter @tacet/desktop dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
